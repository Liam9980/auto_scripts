# =============================================================================
# 浏览器启动自检（只手动触发，不跑定时任务）
# -----------------------------------------------------------------------------
# 用途：hus-renew.py 在 runner 上偶发 BrowserConnectError，同一镜像版本一次成功
# 一次失败。这个 workflow 连续启动浏览器 N 次，量失败率并抓 Chromium 自己的
# stderr（生产脚本里也加了同样的捕获）。
#
# 为什么要单独一个文件：单次续期只有 1 次启动机会，复现率约 1/3；这里一次跑
# 24 次，几分钟就能拿到统计意义上的失败率。
#
# 不占配额：没有 schedule，只有 workflow_dispatch。
# =============================================================================

name: 🔬 浏览器启动自检

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 每种配置启动几次
        required: false
        default: '12'
      proxy:
        description: 是否包含带 SOCKS 代理的配置（B 组）
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRIVATE_REPO: jyucoeng/auto_hus_private
      PROJECT_DIR: hus
      ITERATIONS: ${{ inputs.iterations }}
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4

      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
          fetch-depth: 1
          persist-credentials: false

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          # 和续期流程一致：镜像自带的浏览器直接用，只补缺的
          missing=""
          command -v chromium >/dev/null 2>&1 || command -v chromium-browser >/dev/null 2>&1 \
            || missing="$missing chromium"
          for bin in Xvfb curl wget jq unzip; do
            command -v "$bin" >/dev/null 2>&1 || missing="$missing $bin"
          done
          if [ -n "$missing" ]; then
            echo "[INFO] 镜像缺少:$missing，补装"
            sudo apt-get update
            sudo apt-get install -y $missing
          else
            echo "[INFO] 浏览器和基础工具镜像已自带，跳过 apt"
          fi
          pip install --upgrade pip -q
          pip install -r requirements.txt -q
          # 预生成字体缓存：Chromium 第一次启动会在容器里现算字体缓存，实测要 20 秒以上，
          # 正好撞上 DrissionPage 默认的 30 秒连接超时（偶发 BrowserConnectError 的根源）。
          fc-cache -f >/dev/null 2>&1 || true
          FFMPEG_BIN=$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')
          sudo ln -sf "$FFMPEG_BIN" /usr/local/bin/ffmpeg
          for b in chromium chromium-browser google-chrome; do
            if command -v "$b" >/dev/null 2>&1; then
              echo "[INFO] 浏览器 $b: $("$b" --version 2>&1 | head -1) → $(command -v "$b")"
            fi
          done

      - name: 连续启动浏览器
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          set +e
          python3 -u browser_selftest.py "${ITERATIONS:-12}" 2>&1 | tee selftest.log
          echo "---- 自检结束 ----"

      - name: 上传自检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-selftest-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/selftest.log
          retention-days: 7
          if-no-files-found: warn
