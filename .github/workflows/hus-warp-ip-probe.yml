# =============================================================================
# WARP 换 IP 手段实测（只手动触发）
# -----------------------------------------------------------------------------
# 目的：确认哪种操作真的能换掉 WARP 出口 IP。
#
# 起因：hus-renew.py 原来用 warp-cli registration delete/new 换 IP，实测有一次
# 连续 20 轮全是 104.28.196.79 —— 重注册只换设备身份，不换接入的 Cloudflare
# colo，出口 IP 自然不动。这个 workflow 把三种候选手段各跑一遍，用 /cdn-cgi/trace
# 报的 ip 判断哪种有效，再回去改续期脚本。
# =============================================================================

name: 🌐 WARP 换 IP 手段实测

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRIVATE_REPO: jyucoeng/auto_hus_private
      PROJECT_DIR: hus
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4

      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
          fetch-depth: 1
          persist-credentials: false

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 启用 WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: ipv4
          mode: client

      - name: 实测换 IP 手段
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          set +e
          python3 -u warp_ip_probe.py 2>&1 | tee warp_probe.log
          echo "---- 实测结束 ----"

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warp-probe-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/warp_probe.log
          retention-days: 7
          if-no-files-found: warn
